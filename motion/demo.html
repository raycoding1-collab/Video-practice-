<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --red: #e3261c; --ink: #0b0b0b; --paper: #f4f2ee; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #000; }
  body { font-family: 'Inter Display', Inter, sans-serif; font-weight: 900; }
  .scene { position: absolute; inset: 0; display: none; flex-direction: column;
           align-items: center; justify-content: center; overflow: hidden; }
  .scene * { animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.9,.2,1);
             animation-delay: calc(var(--s) * 1s + var(--d, 0s)); }
  .ch { display: inline-block; }

  /* 1: OKAY, */
  #s1 { background: var(--red); }
  #s1 .big { font-size: 150px; color: var(--ink); letter-spacing: -6px; animation: slam .45s; }
  #s1 .ha { position: absolute; color: #fff; font-size: 54px; animation: pop .3s; }
  #s1 .ha.a { top: 270px; right: 40px; transform: rotate(-8deg); --d: .35s; }
  #s1 .ha.b { bottom: 290px; right: 70px; transform: rotate(6deg); --d: .55s; }

  /* 2: NO GPU. */
  #s2 { background: var(--paper); }
  #s2 .l { font-size: 170px; line-height: .9; color: var(--ink); animation: up .4s; }
  #s2 .l.r { color: var(--red); --d: .18s; }

  /* 3: NO CREDITS (glitch) */
  #s3 { background: var(--ink); }
  #s3 .g { font-size: 96px; color: #fff; text-align: center; line-height: .95; animation: glitch 1.1s linear; }

  /* 4: 3D ELEMENTS */
  #s4 { background: var(--paper); perspective: 900px; }
  #s4 .row { display: flex; align-items: center; gap: 36px; }
  #s4 .three { font-size: 210px; color: var(--ink); letter-spacing: -8px; animation: up .4s; }
  #s4 .el { font-size: 74px; color: var(--ink); letter-spacing: 2px; margin-top: 10px; animation: up .4s; --d: .2s; }
  .cube { width: 110px; height: 110px; position: relative; transform-style: preserve-3d;
          animation: spin 1.3s linear, pop .35s; }
  .cube div { position: absolute; inset: 0; background: var(--red); border: 2px solid #b51d14; }
  .cube .f1 { transform: translateZ(55px); } .cube .f2 { transform: rotateY(180deg) translateZ(55px); filter: brightness(.7); }
  .cube .f3 { transform: rotateY(90deg) translateZ(55px); filter: brightness(.8); }
  .cube .f4 { transform: rotateY(-90deg) translateZ(55px); filter: brightness(.85); }
  .cube .f5 { transform: rotateX(90deg) translateZ(55px); filter: brightness(1.15); }
  .cube .f6 { transform: rotateX(-90deg) translateZ(55px); filter: brightness(.6); }

  /* 5: UNLIMITED (letter drop) */
  #s5 { background: var(--ink); }
  #s5 .w { font-size: 84px; color: #fff; letter-spacing: 1px; }
  #s5 .w .ch { animation: drop .45s; --d: calc(var(--i) * .05s); }
  #s5 .sub { margin-top: 18px; font: 600 22px Inter; color: #9a9a9a; letter-spacing: 8px; animation: fade .5s; --d: .6s; }

  /* 6: RENDER. (light streak + timecode) */
  #s6 { background: #050505; }
  #s6 .r { font-size: 118px; color: #e9e9e9; letter-spacing: 2px; animation: blurin .5s; }
  #s6 .streak { position: absolute; top: 455px; left: -40%; width: 60%; height: 4px;
                background: linear-gradient(90deg, transparent, #fff, #ff5a3c, transparent);
                box-shadow: 0 0 24px 6px rgba(255,90,60,.6); transform: rotate(-12deg); animation: sweep .9s; --d: .2s; }
  #s6 .tc { margin-top: 20px; font: 700 40px 'JetBrains Mono'; color: #cfcfcf; letter-spacing: 4px; }

  /* 7: NO LIMITS AT ALL. */
  #s7 { background: var(--paper); }
  #s7 .l { font-size: 132px; line-height: .88; color: var(--ink); animation: slam .35s; }
  #s7 .l.r { color: var(--red); --d: .15s; } #s7 .l.c { --d: .3s; }

  /* 8: MADE WITH CLAUDE */
  #s8 { background: var(--ink); }
  #s8 .m { font: 600 26px Inter; color: #bdbdbd; letter-spacing: 10px; animation: fade .5s; }
  #s8 .c { font-size: 120px; color: #fff; letter-spacing: -2px; margin-top: 6px;
           text-shadow: 0 0 40px rgba(217,119,87,.75); animation: blurin .7s; --d: .2s; }
  #s8 .line { width: 0; height: 3px; background: #d97757; margin-top: 22px; animation: grow .8s; --d: .5s; }

  @keyframes slam { from { transform: scale(1.6) rotate(-3deg); opacity: 0; } 60% { transform: scale(.94); opacity: 1; } to { transform: scale(1); } }
  @keyframes pop { from { scale: 0; } 70% { scale: 1.2; } to { scale: 1; } }
  @keyframes up { from { transform: translateY(80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drop { from { transform: translateY(-140px) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blurin { from { filter: blur(24px); opacity: 0; transform: scale(1.15); } to { filter: blur(0); opacity: 1; transform: none; } }
  @keyframes spin { from { transform: rotateX(-25deg) rotateY(0); } to { transform: rotateX(-25deg) rotateY(300deg); } }
  @keyframes sweep { from { left: -60%; } to { left: 110%; } }
  @keyframes grow { to { width: 260px; } }
  @keyframes glitch {
    0% { filter: blur(18px); opacity: 0; transform: skewX(20deg); }
    12% { filter: blur(0); opacity: 1; transform: translateX(-14px); text-shadow: 6px 0 #ff2a2a, -6px 0 #22e1ff; }
    18% { transform: translateX(10px); text-shadow: -8px 0 #ff2a2a, 8px 0 #22e1ff; clip-path: inset(10% 0 40% 0); }
    24% { transform: none; text-shadow: 3px 0 #ff2a2a, -3px 0 #22e1ff; clip-path: inset(0); }
    60% { text-shadow: 2px 0 #ff2a2a, -2px 0 #22e1ff; }
    66% { transform: translateX(-8px); clip-path: inset(55% 0 5% 0); }
    70% { transform: none; clip-path: inset(0); text-shadow: none; }
    100% { transform: none; }
  }
</style>
</head>
<body>
  <section class="scene" id="s1" data-start="0" data-end="1.1">
    <div class="big">OKAY,</div><div class="ha a">HA</div><div class="ha b">HA</div>
  </section>
  <section class="scene" id="s2" data-start="1.1" data-end="2.2">
    <div class="l">NO</div><div class="l r">GPU.</div>
  </section>
  <section class="scene" id="s3" data-start="2.2" data-end="3.3">
    <div class="g">NO<br>CREDITS</div>
  </section>
  <section class="scene" id="s4" data-start="3.3" data-end="4.6">
    <div class="row"><div class="three">3D</div>
      <div class="cube"><div class="f1"></div><div class="f2"></div><div class="f3"></div><div class="f4"></div><div class="f5"></div><div class="f6"></div></div></div>
    <div class="el">ELEMENTS</div>
  </section>
  <section class="scene" id="s5" data-start="4.6" data-end="5.8">
    <div class="w split">UNLIMITED</div><div class="sub">RENDERS PER DAY</div>
  </section>
  <section class="scene" id="s6" data-start="5.8" data-end="7.1">
    <div class="r">RENDER.</div><div class="tc" id="tc">00:00:00</div><div class="streak"></div>
  </section>
  <section class="scene" id="s7" data-start="7.1" data-end="8.2">
    <div class="l">NO</div><div class="l r">LIMITS</div><div class="l c">AT ALL.</div>
  </section>
  <section class="scene" id="s8" data-start="8.2" data-end="9.8">
    <div class="m">MADE WITH</div><div class="c">CLAUDE</div><div class="line"></div>
  </section>
<script>
  window.DURATION = 9.8;
  const scenes = [...document.querySelectorAll('.scene')];
  scenes.forEach((s) => s.style.setProperty('--s', s.dataset.start));
  document.querySelectorAll('.split').forEach((el) => {
    el.innerHTML = [...el.textContent].map((c, i) => `<span class="ch" style="--i:${i}">${c}</span>`).join('');
  });
  const tc = document.getElementById('tc');
  window.seek = (t) => {
    for (const s of scenes) s.style.display = t >= +s.dataset.start && t < +s.dataset.end ? 'flex' : 'none';
    const k = Math.max(0, Math.min(1, (t - 5.8) / 1.2));
    const f = Math.floor((1 - (1 - k) ** 3) * 4 * 3600);
    tc.textContent = [f / 3600, (f / 60) % 60, f % 60].map((n) => String(Math.floor(n)).padStart(2, '0')).join(':');
  };
  window.seek(0);
</script>
</body>
</html>
